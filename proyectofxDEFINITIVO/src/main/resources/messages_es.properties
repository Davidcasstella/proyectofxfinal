who_we_are_text=En Fundación GarrasyBigotes nos dedicamos al rescate y cuidado de animales en situación de calle, brindándoles atención veterinaria, alimentación y un espacio seguro donde puedan rehabilitarse física y emocionalmente. Trabajamos con amor y compromiso para darles una segunda oportunidad a estos seres maravillosos, promoviendo la adopción responsable y el respeto hacia todos los animales.

join_us_text=Si eres amante de los animales y deseas hacer la diferencia, te invitamos a ser parte de nuestra misión. Puedes unirte como voluntario, adoptante o colaborador. Juntos podemos mejorar la vida de muchos animales que lo necesitan. ¡Tu ayuda es fundamental para seguir adelante con este hermoso proyecto!
