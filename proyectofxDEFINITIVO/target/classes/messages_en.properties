who_we_are_text=At GarrasyBigotes Foundation, we dedicate ourselves to rescuing and caring for animals in street situations, providing them with veterinary care, food, and a safe space where they can rehabilitate physically and emotionally. We work with love and commitment to give these wonderful beings a second chance, promoting responsible adoption and respect for all animals.

join_us_text=If you love animals and want to make a difference, we invite you to be part of our mission. You can join as a volunteer, adopter, or collaborator. Together, we can improve the lives of many animals who need it. Your help is essential to keep moving forward with this beautiful project!
